name: Docker release

on:
  push:
    tags:
      - 'v*'
    # Also build the image, without publishing it, when a push to a branch
    # changes it. Tags aren't filtered by paths.
    branches:
      - '**'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-release.yml'

# Images are published to the GitHub Container Registry of the repository,
# which needs no secrets besides the workflow's token.
env:
  IMAGE: ghcr.io/fortiphyd/iec-checker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
